<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temp Emails – TempMail Pro Admin</title>
  <link rel="stylesheet" href="assets/admin.css" />
  <link rel="stylesheet" href="../assets/css/fontawesome.min.css" />
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body>
<div class="layout">
  <div id="sc"></div>
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
        <h1>Temp Email Management</h1>
      </div>
      <div class="topbar-right">
        <span id="totalCount" class="badge badge-brand">0 total</span>
      </div>
    </header>
    <div class="page-content">
      <div class="card mb-4">
        <div class="card-body" style="padding:16px">
          <div class="search-wrap">
            <i class="fas fa-magnifying-glass"></i>
            <input class="form-control" id="searchInput" placeholder="Search by email address…" oninput="debounce(loadEmails,400)()" style="padding-left:36px" />
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-envelope text-brand"></i> All Temporary Email Addresses</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Address</th><th>Domain</th><th>Owner</th><th>Messages</th><th>Expires</th><th>Status</th><th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody id="emailsBody">
              <tr><td colspan="8" style="text-align:center;color:var(--text3);padding:40px">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/admin.js"></script>
<script>
  document.getElementById('sc').innerHTML = sb('emails');
  initPage();
  let currentPage = 1, debounceTimer;
  function debounce(fn,d){return function(...a){clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>fn(...a),d);}}

  async function loadEmails(page = currentPage) {
    currentPage = page;
    const search = document.getElementById('searchInput').value;
    const params = new URLSearchParams({ page, limit:25, search });
    try {
      const d = await GET(`/api/admin/emails?${params}`);
      document.getElementById('totalCount').textContent = d.total + ' total';
      const tbody = document.getElementById('emailsBody');
      if (!d.emails.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:40px">No emails found</td></tr>';
      } else {
        const now = new Date();
        tbody.innerHTML = d.emails.map(e => {
          const exp = new Date(e.expires_at.includes('T') ? e.expires_at : e.expires_at.replace(' ','T')+'Z');
          const isExpired = exp < now || e.is_deleted;
          return `
          <tr>
            <td>${e.id}</td>
            <td class="monospace">${e.address}</td>
            <td><span class="badge badge-brand">@${e.domain}</span></td>
            <td>${e.owner || '<span class="text-muted">—</span>'}</td>
            <td>${fmtNum(e.message_count)}</td>
            <td>${fmtDateTime(e.expires_at)}</td>
            <td>${isExpired ? '<span class="badge badge-gray">Expired</span>' : '<span class="badge badge-success">Active</span>'}</td>
            <td style="text-align:right">
              <button class="btn btn-danger btn-xs" onclick="deleteEmail(${e.id})">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>`;}).join('');
      }
      const pEl = document.getElementById('pagination');
      pEl.innerHTML = '';
      pEl.appendChild(buildPagination(page, d.total, 25, loadEmails));
    } catch(e) { showToast('Failed: ' + e.message, 'error'); }
  }

  async function deleteEmail(id) {
    const ok = await showConfirm('Delete this temp email address and all its messages?', 'Delete Email');
    if (!ok) return;
    try {
      await DELETE(`/api/admin/emails/${id}`);
      showToast('Email deleted', 'success');
      loadEmails();
    } catch(e) { showToast(e.message, 'error'); }
  }

  function sb(a) {
    const items = [['dashboard','fa-chart-pie','Dashboard','dashboard.html'],['users','fa-users','Users','users.html'],['emails','fa-envelope','Temp Emails','emails.html'],['messages','fa-inbox','Messages','messages.html'],['domains','fa-globe','Domains','domains.html'],['settings','fa-gear','Settings','settings.html'],['audit','fa-scroll','Audit Log','audit.html']];
    return `<aside class="sidebar"><div class="sidebar-logo"><div class="icon"><i class="fas fa-shield-halved"></i></div><div><div class="brand">TempMail Pro</div><div class="sub">Admin Panel</div></div></div><nav style="flex:1;overflow-y:auto"><div class="nav-section"><div class="nav-section-label">Navigation</div>${items.map(([id,icon,label,href])=>`<a href="${href}" class="nav-item ${a===id?'active':''}" ><i class="fas ${icon} icon"></i> ${label}</a>`).join('')}<a href="/" target="_blank" class="nav-item"><i class="fas fa-arrow-up-right-from-square icon"></i> View Site</a></div></nav><div class="sidebar-footer"><div class="sidebar-user" onclick="logout()"><div class="sidebar-avatar" id="sidebar-avatar">AD</div><div class="sidebar-user-info"><div class="name truncate" id="sidebar-user-name" style="max-width:140px">admin</div><div class="role" id="sidebar-user-role">superadmin</div></div><i class="fas fa-sign-out-alt text-muted" style="margin-left:auto;font-size:13px"></i></div></div></aside>`;
  }

  loadEmails();
</script>
</body>
</html>
